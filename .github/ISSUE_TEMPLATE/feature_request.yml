name: Enterprise Change Request (ECR)
description: Propose an enterprise functional module, architecture enhancement, or regulatory localization for GoERP.
title: "[ECR]: <enterprise change title>"
labels: ["enhancement", "architecture-review"]
body:
  - type: markdown
    attributes:
      value: |
        **GoERP Enterprise Change Request (ECR) Intake**  
        All non-trivial feature additions and architectural modifications require review by the Technical Review Board (TRB).
  - type: input
    id: internal_initiative
    attributes:
      label: Jira Initiative / Internal Ticket ID
      description: Enter the corresponding internal Jira epic or project tracking key.
      placeholder: "e.g., ERP-2048 or FIN-CORP-Q4"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Functional Category
      options:
        - "Core Architecture & Data Engine"
        - "Financial Accounting & General Ledger"
        - "Supply Chain & Warehouse Management (WMS)"
        - "Manufacturing (MRP II) & Quality"
        - "Customs & Regional Tax Localization"
        - "Integration Hub & M2M RPC Protocols"
        - "User Experience & Web SPA Client"
    validations:
      required: true
  - type: textarea
    id: business_case
    attributes:
      label: Business Justification & ROI
      description: Explain the business necessity, client requirement, or operational efficiency gain driving this proposal.
    validations:
      required: true
  - type: textarea
    id: technical_specification
    attributes:
      label: Technical Design & Proposed Architecture
      description: Outline the proposed database schema, API contracts, balance invariants, and module interactions.
    validations:
      required: true
  - type: textarea
    id: compatibility_impact
    attributes:
      label: Backward Compatibility & Migration Impact
      description: Detail whether this change impacts existing database tables, API schemas, or requires zero-downtime data migration.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Enterprise Target Priority
      options:
        - "P1 - Critical Enterprise Requirement (Current Release Stream)"
        - "P2 - Strategic Enhancement (Next Minor Release)"
        - "P3 - Optimization / Long-term Architecture Roadmap"
    validations:
      required: true
