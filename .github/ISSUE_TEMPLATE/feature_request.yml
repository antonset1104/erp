name: 💡 Feature Request
description: Propose an enterprise module improvement, business workflow addition, or system optimization for GoERP.
title: "[FEAT]: <feature proposal title>"
labels: ["enhancement", "feature"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make GoERP even more powerful? Tell us about the business need or technical capability you would like to see!
  - type: dropdown
    id: category
    attributes:
      label: Enhancement Category
      options:
        - "New Business Module"
        - "Existing Module Enhancement"
        - "Regional Tax & Regulatory Localization"
        - "API, RPC & Webhook Integration"
        - "Performance, Scalability & Database Engine"
        - "User Experience / UI Design"
        - "Documentation & Testing Suite"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Underlying Problem or Business Use Case
      description: Describe the operational pain point or workflow requirement this feature solves.
      placeholder: "E.g., Currently bank reconciliation requires manual CSV mapping for format X..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution & Workflow
      description: Explain how this feature should work from both a user and technical perspective.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have tested or evaluated?
  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to Contribute
      options:
        - label: I am interested in helping implement this feature via a Pull Request.
