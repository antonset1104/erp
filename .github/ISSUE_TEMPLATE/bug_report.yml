name: 🐛 Bug Report
description: Report unexpected behavior, transaction calculation failures, or system errors in GoERP.
title: "[BUG]: <concise description of the issue>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue! A clear, reproducible bug report helps the community identify and fix issues faster.
  - type: dropdown
    id: module
    attributes:
      label: Affected Module
      description: Select the ERP module where the bug occurs.
      options:
        - "Executive Dashboard & Command Center (Ctrl+K)"
        - "Base & Authentication (base / res.users / res.partner)"
        - "Inventory & Stock (stock / stock.picking)"
        - "Sales & Quotations (sale / sale.order)"
        - "Purchases & RFQ (purchase / purchase.order)"
        - "Accounting & Invoicing (account / account.move)"
        - "Manufacturing & BOM (mrp / mrp.production)"
        - "Point of Sale / POS (pos / pos.order)"
        - "HRIS, Attendance & Payroll (hr / hr.payslip)"
        - "CRM & Sales Pipeline (crm / crm.lead)"
        - "Customs & Bonded Zones (customs_bonded)"
        - "Tax & Fiscal Localization (tax_efaktur / tax_ebupot)"
        - "Treasury & Multi-Bank (treasury)"
        - "Low-Code Studio & Dynamic Schemas (lowcode_studio)"
        - "BPMN 2.0 Workflow Engine (workflow_engine)"
        - "Universal Integration Hub & Open RPC (integration_hub)"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what happened and how the problem manifested.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide clear, sequential steps to reproduce this behavior.
      placeholder: |
        1. Navigate to the 'Sales & Quotations' module
        2. Create a Sales Order for customer '...'
        3. Click 'Confirm Order'
        4. Observe error message '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened under normal operational conditions?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Details
      description: E.g., Go 1.22.5, Windows 11 / Ubuntu 22.04, Chrome 128, SQLite / PostgreSQL.
      placeholder: "Go 1.22.x, OS Linux/Windows, Browser Chrome/Firefox, SQLite/PostgreSQL"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs or Browser Console Output
      description: Paste any relevant terminal logs, stack traces, or browser console errors.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Submitter Checklist
      options:
        - label: I have verified this bug is not already reported in existing issues.
          required: true
        - label: I have provided clear reproduction steps and relevant logs.
          required: true
