# ==============================================================================
# Google Cloud Platform (GCP) CI/CD Deployment Pipeline for GoERP
# Services: Cloud Build -> Artifact Registry -> Cloud Run + Cloud SQL PostgreSQL
# ==============================================================================
steps:
  # Step 1: Run Go Vet & Automated 54+ Section Integration Test Suite
  - name: 'golang:1.22'
    id: 'run-erp-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        go vet ./...
        go test -v ./tests/...

  # Step 2: Build Multi-Stage Container Image for Google Cloud Run
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-container-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/goerp-server:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/goerp-server:latest'
      - '.'

  # Step 3: Push Container Image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-artifact-registry'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/goerp-server'

  # Step 4: Deploy Serverless Enterprise ERP to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/goerp-server:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=2'
      - '--min-instances=1'
      - '--max-instances=25'
      - '--set-env-vars=ENVIRONMENT=production,AI_PROVIDER=gemini,GCP_PROJECT_ID=$PROJECT_ID,GCP_LOCATION=${_REGION},GCP_BIGQUERY_DATASET=${_BQ_DATASET}'

substitutions:
  _REGION: 'asia-southeast2'
  _REPO_NAME: 'goerp-containers'
  _SERVICE_NAME: 'goerp-enterprise'
  _BQ_DATASET: 'goerp_analytics'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/goerp-server:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/goerp-server:latest'
