version: '3.8'

services:
  # GoERP Backend & Dashboard
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=erp
      - DB_PASSWORD=erp_secret_password
      - DB_NAME=erp_db
      - JWT_SECRET=super-secure-production-jwt-token-key-2026
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp_net

  # PostgreSQL 16 Enterprise Database
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=erp
      - POSTGRES_PASSWORD=erp_secret_password
      - POSTGRES_DB=erp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - erp_net

  # Redis for In-Memory Caching & Session Storage
  redis:
    image: redis:7-alpine
    container_name: erp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - erp_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  erp_net:
    driver: bridge
