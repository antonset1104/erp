version: '3.8'

services:
  # Odoo-Go ERP Backend & Dashboard
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odoo_go_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=odoo
      - DB_PASSWORD=odoo_secret_password
      - DB_NAME=odoo_erp
      - JWT_SECRET=super-secure-production-jwt-token-key-2026
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - odoo_net

  # PostgreSQL 16 Enterprise Database
  postgres:
    image: postgres:16-alpine
    container_name: odoo_go_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo_secret_password
      - POSTGRES_DB=odoo_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo_erp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - odoo_net

  # Redis for In-Memory Caching & Session Storage
  redis:
    image: redis:7-alpine
    container_name: odoo_go_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - odoo_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  odoo_net:
    driver: bridge
